{% extends "base.html" %}

{% block title %}
Blood Request
{% endblock %}

{% block content %}

<section class="page-section">

    <div class="form-container">

        <div class="form-header">

            <div class="form-icon">
                &#9829;
            </div>

            <h1>
                Blood Request
            </h1>

            <p>
                Submit a request for blood assistance.
            </p>

        </div>


        <form method="POST"
              class="donor-form">

            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Patient Name
                    </label>

                    <input type="text"
                           name="patient_name"
                           placeholder="Enter patient name"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Blood Group
                    </label>

                    <select name="blood_group"
                            required>

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">
                            A+
                        </option>

                        <option value="A-">
                            A-
                        </option>

                        <option value="B+">
                            B+
                        </option>

                        <option value="B-">
                            B-
                        </option>

                        <option value="AB+">
                            AB+
                        </option>

                        <option value="AB-">
                            AB-
                        </option>

                        <option value="O+">
                            O+
                        </option>

                        <option value="O-">
                            O-
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Required Units
                    </label>

                    <input type="number"
                           name="units"
                           min="1"
                           max="20"
                           placeholder="Example: 2"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Hospital
                    </label>

                    <input type="text"
                           name="hospital"
                           placeholder="Hospital name"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        City
                    </label>

                    <input type="text"
                           name="city"
                           placeholder="Hospital city"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Contact Phone
                    </label>

                    <input type="tel"
                           name="phone"
                           placeholder="Contact number"
                           required>

                </div>


                <div class="form-group full-width">

                    <label>
                        Reason / Additional Information
                    </label>

                    <textarea name="reason"
                              rows="5"
                              placeholder="Enter additional information"></textarea>

                </div>

            </div>


            <div class="form-submit">

                <button type="submit"
                        class="btn btn-primary">

                    Submit Blood Request

                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
