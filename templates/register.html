{% extends "base.html" %}

{% block title %}Register Donor{% endblock %}

{% block content %}

<div class="form-container">

    <h1>🩸 Donor Registration</h1>

    <form method="POST">

        <label>Full Name</label>

        <input type="text"
               name="name"
               required>


        <label>Age</label>

        <input type="number"
               name="age"
               min="18"
               max="65"
               required>


        <label>Gender</label>

        <select name="gender" required>

            <option value="">Select Gender</option>

            <option>Male</option>

            <option>Female</option>

            <option>Other</option>

        </select>


        <label>Blood Group</label>

        <select name="blood_group" required>

            <option value="">Select Blood Group</option>

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

        </select>


        <label>Phone</label>

        <input type="tel"
               name="phone"
               required>


        <label>Email</label>

        <input type="email"
               name="email">


        <label>City</label>

        <input type="text"
               name="city"
               required>


        <label>Address</label>

        <textarea name="address"></textarea>


        <label>Last Donation Date</label>

        <input type="date"
               name="last_donation">


        <button type="submit"
                class="btn">
            Register Donor
        </button>

    </form>

</div>

{% endblock %}
