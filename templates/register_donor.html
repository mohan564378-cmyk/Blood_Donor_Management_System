{% extends "base.html" %}

{% block title %}
Donor Registration - Blood Donor Management System
{% endblock %}

{% block content %}

<section class="page-section">

<div class="form-container">

    <div class="form-header">
        <div class="form-icon">♥</div>

        <h1>Donor Registration</h1>

        <p>
            Register as a blood donor and help save lives.
        </p>
    </div>


    <form method="POST" class="donor-form">

        <div class="form-grid">

            <!-- Full Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Age -->
            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="18"
                    max="65"
                    placeholder="Enter your age"
                    required
                >

            </div>


            <!-- Gender -->
            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- Blood Group -->
            <div class="form-group">

                <label for="blood_group">
                    Blood Group
                </label>

                <select
                    id="blood_group"
                    name="blood_group"
                    required
                >

                    <option value="">
                        Select Blood Group
                    </option>

                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>

            </div>


            <!-- Phone -->
            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                >

            </div>


            <!-- City -->
            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    name="city"
                    placeholder="Enter your city"
                    required
                >

            </div>


            <!-- Last Donation -->
            <div class="form-group">

                <label for="last_donation">
                    Last Donation Date
                </label>

                <input
                    type="date"
                    id="last_donation"
                    name="last_donation"
                >

            </div>


            <!-- Address -->
            <div class="form-group full-width">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="4"
                    placeholder="Enter your address"
                    required
                ></textarea>

            </div>

        </div>


        <!-- Submit -->
        <div class="form-submit">

            <button
                type="submit"
                class="btn btn-primary"
            >
                ♥ Register Donor
            </button>

        </div>

    </form>

</div>

</section>

{% endblock %}
